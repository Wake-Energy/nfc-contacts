<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>Hunter Wheeler — Wake Energy</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f5f5f7; color: #111; }
    main { width: min(100%, 420px); padding: 36px 28px; text-align: center; background: #fff; border-radius: 24px; box-shadow: 0 12px 40px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.02em; }
    .title { margin: 0 0 28px; color: #666; font-size: 17px; line-height: 1.4; }
    .button { display: block; width: 100%; padding: 16px 20px; border-radius: 14px; background: #111; color: #fff; text-decoration: none; font-size: 18px; font-weight: 650; }
    .note { margin: 18px 0 0; color: #777; font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <h1>Hunter Wheeler</h1>
    <p class="title">Head of Pouches<br>Wake Energy</p>
    <a class="button" href="./hunter.vcf" type="text/vcard">Add to Contacts</a>
    <p class="note">Your phone will ask you to confirm the contact.</p>
  </main>

</html>
